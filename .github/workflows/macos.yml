name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build
        run: swift build
      - name: Test
        run: swift test --enable-code-coverage
      - name: Package app
        run: scripts/package_app.sh release
      - name: Verify packaged app
        run: scripts/verify_app.sh dist/Evee.app
      - name: Archive packaged app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Evee.app "dist/Evee-${GITHUB_SHA}.zip"
      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: Evee-${{ github.sha }}
          path: dist/Evee-${{ github.sha }}.zip
          if-no-files-found: error
