name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build
        run: swift build --build-tests --enable-code-coverage
      - name: Test
        timeout-minutes: 5
        run: swift test --enable-code-coverage --skip-build
      - name: Smoke test MCP protocol and tools
        run: bash scripts/smoke_mcp.sh
      - name: Package app
        run: scripts/package_app.sh release
      - name: Verify packaged app
        run: scripts/verify_app.sh dist/Evee.app
      - name: Archive packaged app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Evee.app "dist/Evee-${GITHUB_SHA}.zip"
      - name: Upload packaged app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Evee-${{ github.sha }}
          path: dist/Evee-${{ github.sha }}.zip
          if-no-files-found: error
