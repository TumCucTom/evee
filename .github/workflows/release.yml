name: notarized-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version for the artifact label
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.EVEE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.EVEE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.EVEE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_P12"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          keychain="$RUNNER_TEMP/evee-signing.keychain-db"
          certificate="$RUNNER_TEMP/evee-signing.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode >"$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
      - name: Configure App Store Connect API credentials
        env:
          API_PRIVATE_KEY: ${{ secrets.EVEE_APPLE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.EVEE_APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.EVEE_APPLE_API_ISSUER_ID }}
        run: |
          test -n "$API_PRIVATE_KEY"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          key_file="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" >"$key_file"
          xcrun notarytool store-credentials evee-ci-notary --key "$key_file" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
      - name: Resolve signing identity
        id: identity
        run: |
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity"
          echo "identity=$identity" >>"$GITHUB_OUTPUT"
      - name: Build, sign and notarize
        env:
          EVEE_CODESIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
          EVEE_NOTARY_PROFILE: evee-ci-notary
        run: scripts/release_app.sh
      - name: Upload notarized release
        uses: actions/upload-artifact@v4
        with:
          name: Evee-${{ inputs.version }}-notarized
          path: |
            dist/Evee.dmg
            dist/Evee.dmg.sha256
          if-no-files-found: error
          retention-days: 30
